# -----------------------------------------------------------------------------
# 工作流：解压并合并分卷/分片压缩包（健壮版 v3 — ftfy mojibake 修复）
# -----------------------------------------------------------------------------
name: 自动解压并合并分卷压缩包
on:
  push:
    branches: [ main, master, GM82 ]
    paths:
      - '**.zip'
      - '**.7z'
      - '**.rar'
      - '**.tar'
      - '**.tar.gz'
      - '**.tgz'
      - '**.tar.bz2'
      - '**.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_all_archives:
    runs-on: ubuntu-22.04
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: extract-archives-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装解压依赖与 ftfy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full unrar
          python3 -m pip install --quiet --disable-pip-version-check ftfy

      - name: 查找、归组、解压合并、暂存并删除压缩包
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """解压并合并分卷，自动修复 Windows mojibake 文件名。"""
          import filecmp, os, re, shutil, subprocess, sys, tarfile, unicodedata
          import zipfile
          from pathlib import Path

          import ftfy  # 装在依赖步骤里

          ROOT = Path(".")
          ARCHIVE_EXTS = (".zip", ".7z", ".rar", ".tar", ".tar.gz",
                          ".tar.bz2", ".tar.xz", ".tgz")
          PART_RE = re.compile(r"[._-](part|pt|vol)[0-9]{1,3}$", re.I)
          BOMB_LIMIT = 20 * 1024 * 1024 * 1024     # 20GB 上限

          # ── 名字修复 ─────────────────────────────────────────────
          def looks_mojibake(s):
              if s.isascii():
                  return False
              if any(m in s for m in ("Ã", "Â", "â", "Ãƒ")):
                  return True
              return any(0x80 <= ord(c) <= 0x9F for c in s)

          def normalize_filename(name):
              if looks_mojibake(name):
                  name = ftfy.fix_text(
                      name, normalization="NFC",
                      uncurl_quotes=False, fix_line_breaks=False,
                      fix_entities=False,
                  )
              out = []
              for c in name:
                  cat = unicodedata.category(c)
                  if c in "\t\n\r\x0b\x0c":
                      out.append(" ")
                  elif cat in ("Zs", "Zl", "Zp") and c != " ":
                      out.append(" ")
                  else:
                      out.append(c)
              s = "".join(out)
              while "Â " in s:
                  s = s.replace("Â ", " ")
              s = re.sub(r" {2,}", " ", s).strip()
              return unicodedata.normalize("NFC", s)

          # ── 归组 ─────────────────────────────────────────────────
          def is_archive(n):
              return n.lower().endswith(ARCHIVE_EXTS)

          def strip_ext(n):
              low = n.lower()
              for ext in sorted(ARCHIVE_EXTS, key=len, reverse=True):
                  if low.endswith(ext):
                      return n[: -len(ext)]
              return n

          def group_key(p):
              return p.parent / PART_RE.sub("", strip_ext(p.name))

          def natural_key(p):
              return [(0, int(t)) if t.isdigit() else (1, t.lower())
                      for t in re.split(r"(\d+)", str(p))]

          # ── 路径安全 ─────────────────────────────────────────────
          def safe_target(dest, name):
              name = name.replace("\\", "/")
              parts = [p for p in name.split("/") if p not in ("", ".")]
              if any(p == ".." for p in parts):
                  raise ValueError(f"路径穿越: {name!r}")
              t = dest.joinpath(*parts)
              try:
                  t.resolve().relative_to(dest.resolve())
              except ValueError:
                  raise ValueError(f"路径穿越: {name!r}")
              return t

          def unique_target(t):
              if not t.exists():
                  return t
              stem, suf = t.stem, t.suffix
              n = 2
              while True:
                  c = t.with_name(f"{stem}__dup{n}{suf}")
                  if not c.exists():
                      return c
                  n += 1

          # ── zip bomb 守卫 ─────────────────────────────────────────
          class BombGuard:
              def __init__(self, limit=BOMB_LIMIT):
                  self.limit = limit
                  self.total = 0

              def add(self, n):
                  self.total += n
                  if self.total > self.limit:
                      raise RuntimeError(
                          f"解压总量 {self.total} 超过上限 {self.limit}")

          # ── 解压 ─────────────────────────────────────────────────
          def extract_zip(path, dest, guard):
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      raw = info.filename
                      name = normalize_filename(raw)
                      if not name:
                          continue
                      if name != raw:
                          print(f"     [修复] {raw!r} -> {name!r}")
                      target = safe_target(dest, name)
                      if info.is_dir() or name.endswith("/"):
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if name != raw:
                          target = unique_target(target)
                      with zf.open(info) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      guard.add(info.file_size)
                      mode = (info.external_attr >> 16) & 0o777
                      if mode:
                          try:
                              os.chmod(target, mode)
                          except OSError:
                              pass

          def extract_tar(path, dest, guard):
              with tarfile.open(path) as tf:
                  for m in tf.getmembers():
                      name = normalize_filename(m.name)
                      if not name:
                          continue
                      if m.isdir():
                          safe_target(dest, name).mkdir(parents=True,
                                                        exist_ok=True)
                          continue
                      if not m.isfile():
                          continue
                      t = safe_target(dest, name)
                      t.parent.mkdir(parents=True, exist_ok=True)
                      if name != m.name:
                          t = unique_target(t)
                      src = tf.extractfile(m)
                      if src is None:
                          continue
                      with src, open(t, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      guard.add(m.size)
                      if m.mode:
                          try:
                              os.chmod(t, m.mode & 0o777)
                          except OSError:
                              pass

          def run(cmd):
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  raise RuntimeError(r.stderr.decode("utf-8",
                                                      "replace")[:800])

          def extract(path, dest, guard):
              dest.mkdir(parents=True, exist_ok=True)
              low = path.name.lower()
              if low.endswith(".zip"):
                  extract_zip(path, dest, guard)
              elif low.endswith((".tar.gz", ".tgz", ".tar.bz2",
                                 ".tar.xz", ".tar")):
                  extract_tar(path, dest, guard)
              elif low.endswith(".7z"):
                  run(["7z", "x", str(path), f"-o{dest}",
                       "-y", "-bso0", "-bsp0"])
              elif low.endswith(".rar"):
                  run(["unrar", "x", "-o+", "-idq",
                       str(path), f"{dest}/"])
              else:
                  raise ValueError(f"未知格式: {path}")

          # ── 扫描 & 主流程 ─────────────────────────────────────────
          def find_archives(root):
              out = []
              for dp, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for f in files:
                      if is_archive(f):
                          out.append(Path(dp) / f)
              return out

          def main():
              archives = find_archives(ROOT)
              if not archives:
                  print("未找到压缩文件。")
                  return 0
              print(f"找到 {len(archives)} 个压缩文件，开始归组...")

              groups = {}
              for p in archives:
                  k = group_key(p)
                  groups.setdefault(k, []).append(p)
                  print(f"  归组: {p}  ->  {k}")

              guard = BombGuard()
              fail = 0
              for key in sorted(groups, key=natural_key):
                  parts = sorted(groups[key], key=natural_key)
                  dest = key
                  print(f"=== 组 ({len(parts)} 个分卷) -> {dest} ===")
                  ok = 0
                  for p in parts:
                      if not p.is_file():
                          continue
                      try:
                          print(f"  -> {p}")
                          extract(p, dest, guard)
                          print("     解压成功，删除原文件。")
                          p.unlink()
                          run(["git", "add", "--", str(p)])
                          ok += 1
                      except Exception as e:
                          print(f"     解压失败: {e}，保留该分卷。")
                          fail += 1
                  if ok > 0:
                      print(f"  -> 暂存合并目录: {dest}")
                      run(["git", "add", "--force", "--", str(dest)])
                  try:
                      dest.rmdir()
                  except OSError:
                      pass
              print(f"=== 全部处理完毕，失败分卷数: {fail} ===")
              return 1 if fail else 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

      - name: 提交变动
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "没有文件变动需要提交。"
            exit 0
          fi
          git commit -m "Chore: 自动解压并合并分卷压缩包"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
